[phases.setup]
nixPkgs = ["nodejs_22", "python3"]
aptPkgs = ["build-essential"]

[phases.install]
cmds = ["corepack enable", "pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter @imput/cobalt-web build", "cp web/server.cjs web/build/server.cjs"]

[start]
cmd = "node web/server.cjs"
